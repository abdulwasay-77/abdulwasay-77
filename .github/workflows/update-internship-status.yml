name: Update Internship Status

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update internship status if end date has passed
        run: |
          END_DATE="2026-08-31"
          TODAY=$(date +%Y-%m-%d)

          if [[ "$TODAY" > "$END_DATE" ]]; then
            sed -i 's/Backend AI Engineering Intern at \*\*FlyRank AI\*\* (Jul 2026 - Present)/Completed Internship at **FlyRank AI** (Jul - Aug 2026)/' README.md
            sed -i 's/\*\*Backend AI Engineering Intern - FlyRank AI\*\*/\*\*Completed Internship - FlyRank AI\*\*/' README.md
            sed -i 's/\*July 2026 - Present\*/\*July 2026 - August 2026\*/' README.md
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "Auto-update internship status"
            git push
          else
            echo "No changes needed"
          fi
